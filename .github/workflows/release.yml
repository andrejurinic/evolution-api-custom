name: Release

# Publica uma versão: dispara ao empurrar uma tag v* (ex.: v2.3.7_3).
#
# A tag precisa bater com a "version" do package.json — o job falha se divergir,
# para a imagem publicada nunca anunciar uma versão diferente da que roda dentro
# dela (a rota raiz da API devolve packageJson.version).
#
# Publica em ghcr.io/andrejurinic/evolution-api-custom com duas tags imutáveis:
# a versão e sha-<commit>. A tag "main" continua sendo movida só pelo build de
# push na main, então a versão aqui identifica exatamente o que foi liberado.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Publish image and GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check the tag against package.json
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package="$(node -p "require('./package.json').version")"

          if [ "$tag" != "$package" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${package}."
            echo "Bump package.json first, then tag the commit that carries the bump."
            exit 1
          fi

          echo "version=$package" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/andrejurinic/evolution-api-custom
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=sha-,format=short

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.docker_build.outputs.digest }}
        run: |
          # 7 caracteres: é o mesmo recorte que o docker/metadata-action usa na
          # tag sha-, então a nota do release aponta para uma tag que existe.
          short_sha="${GITHUB_SHA:0:7}"

          cat > release-notes.md <<NOTES
          ## Imagem

          \`\`\`
          ghcr.io/andrejurinic/evolution-api-custom:${VERSION}
          ghcr.io/andrejurinic/evolution-api-custom:sha-${short_sha}
          \`\`\`

          Digest: \`${DIGEST}\`

          No Coolify, aponte o recurso para uma dessas tags e faça o deploy. Para
          voltar atrás, aponte para a tag da versão anterior — as duas são imutáveis.
          NOTES

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --generate-notes
